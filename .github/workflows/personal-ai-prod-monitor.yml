name: Personal AI PROD Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,4,7,10,13,16,19,22 * * *'
      timezone: 'Asia/Novosibirsk'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      N8N_HEALTH_URL: ${{ vars.N8N_HEALTH_URL }}
      MAGIC_BOT_TOKEN: ${{ secrets.MAGIC_BOT_TOKEN }}
      MONITOR_BOT_TOKEN: ${{ secrets.MONITOR_BOT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}

    steps:
      - name: Check Personal AI PROD
        shell: bash
        run: |
          set +e
          FAIL=0
          NL=$'\n'
          REPORT=""

          # 1) n8n + Postgres
          N8N_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/n8n.txt --write-out '%{http_code}' \
            "$N8N_HEALTH_URL" 2>/tmp/n8n-curl.err)
          N8N_RC=$?

          if [ "$N8N_RC" -eq 0 ] && [ "$N8N_CODE" = "200" ]; then
            REPORT="${REPORT}OK n8n / Postgres${NL}"
          else
            FAIL=1
            [ -z "$N8N_CODE" ] && N8N_CODE="no HTTP response"
            REPORT="${REPORT}FAIL n8n / Postgres - HTTP ${N8N_CODE}${NL}"
          fi

          # 2) Production Telegram bot token
          TG_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/tg.json --write-out '%{http_code}' \
            "https://api.telegram.org/bot${MAGIC_BOT_TOKEN}/getMe" 2>/tmp/tg-curl.err)
          TG_RC=$?
          TG_OK=$(jq -r '.ok // false' /tmp/tg.json 2>/dev/null)

          if [ "$TG_RC" -eq 0 ] && [ "$TG_CODE" = "200" ] && [ "$TG_OK" = "true" ]; then
            REPORT="${REPORT}OK Telegram Magic${NL}"
          else
            FAIL=1
            [ -z "$TG_CODE" ] && TG_CODE="no HTTP response"
            TG_DESC=$(jq -r '.description // empty' /tmp/tg.json 2>/dev/null)
            [ -n "$TG_DESC" ] && TG_DESC=" - ${TG_DESC}"
            REPORT="${REPORT}FAIL Telegram Magic - HTTP ${TG_CODE}${TG_DESC}${NL}"
          fi

          # 3) OpenAI auth/model access - GET request, no JSON body.
          AUTH_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /tmp/openai-auth.json --write-out '%{http_code}' \
            https://api.openai.com/v1/models/gpt-5.6-luna \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" 2>/tmp/oai-auth-curl.err)
          AUTH_RC=$?

          if [ "$AUTH_RC" -eq 0 ] && [ "$AUTH_CODE" = "200" ]; then
            REPORT="${REPORT}OK OpenAI auth${NL}"
            AUTH_OK=1
          else
            FAIL=1
            AUTH_OK=0
            [ -z "$AUTH_CODE" ] && AUTH_CODE="no HTTP response"
            AUTH_MSG=$(jq -r '.error.message // empty' /tmp/openai-auth.json 2>/dev/null)
            [ -n "$AUTH_MSG" ] && AUTH_MSG=$(printf '%s' "$AUTH_MSG" | tr '\n' ' ' | cut -c1-180)
            [ -n "$AUTH_MSG" ] && AUTH_MSG=" - ${AUTH_MSG}"
            REPORT="${REPORT}FAIL OpenAI auth - HTTP ${AUTH_CODE}${AUTH_MSG}${NL}"
          fi

          # 4) Real Responses API generation via Python stdlib.
          # Python json.dumps serializes the request body, avoiding shell/curl quoting issues.
          if [ "$AUTH_OK" = "1" ]; then
            python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = "https://api.openai.com/v1/responses"
          payload = {
              "model": "gpt-5.6-luna",
              "input": "Reply with exactly: OK"
          }
          data = json.dumps(payload, separators=(",", ":")).encode("utf-8")

          req = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )

          result = {"ok": False, "http": 0, "code": "", "message": ""}
          try:
              with urllib.request.urlopen(req, timeout=45) as resp:
                  body = resp.read().decode("utf-8", "replace")
                  result["http"] = resp.status
                  result["ok"] = 200 <= resp.status < 300
                  if result["ok"]:
                      parsed = json.loads(body)
                      result["response_id"] = parsed.get("id", "")
          except urllib.error.HTTPError as e:
              result["http"] = e.code
              body = e.read().decode("utf-8", "replace")
              try:
                  parsed = json.loads(body)
                  err = parsed.get("error") or {}
                  result["code"] = str(err.get("code") or err.get("type") or "")
                  result["message"] = str(err.get("message") or "")
              except Exception:
                  result["message"] = body[:220]
          except Exception as e:
              result["message"] = str(e)

          with open("/tmp/openai-generation.json", "w", encoding="utf-8") as f:
              json.dump(result, f)
          PY

            OAI_OK=$(jq -r '.ok // false' /tmp/openai-generation.json 2>/dev/null)
            OAI_CODE=$(jq -r '.http // 0' /tmp/openai-generation.json 2>/dev/null)

            if [ "$OAI_OK" = "true" ]; then
              REPORT="${REPORT}OK OpenAI generation${NL}"
            else
              FAIL=1
              ERR_CODE=$(jq -r '.code // empty' /tmp/openai-generation.json 2>/dev/null)
              ERR_MSG=$(jq -r '.message // empty' /tmp/openai-generation.json 2>/dev/null)
              ERR_MSG=$(printf '%s' "$ERR_MSG" | tr '\n' ' ' | cut -c1-220)
              DETAIL="${ERR_CODE}"
              [ -n "$ERR_MSG" ] && DETAIL="${DETAIL}${DETAIL:+; }${ERR_MSG}"
              REPORT="${REPORT}FAIL OpenAI generation - HTTP ${OAI_CODE}${DETAIL:+ - ${DETAIL}}${NL}"
            fi
          fi

          NOW=$(TZ=Asia/Novosibirsk date '+%d.%m.%Y %H:%M')
          HOUR=$(TZ=Asia/Novosibirsk date '+%H')

          if [ "$FAIL" -ne 0 ]; then
            MESSAGE="ALERT: PERSONAL AI PROD${NL}${NL}${REPORT}${NL}${NOW}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MESSAGE="PERSONAL AI PROD - manual check${NL}${NL}${REPORT}${NL}${NOW}"
          elif [ "$HOUR" = "10" ]; then
            MESSAGE="PERSONAL AI PROD - all systems OK${NL}${NL}${REPORT}${NL}${NOW}"
          else
            echo "All checks passed; silent scheduled run."
            exit 0
          fi

          SEND_CODE=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /tmp/send.json --write-out '%{http_code}' \
            -X POST "https://api.telegram.org/bot${MONITOR_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALERT_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")

          if [ "$SEND_CODE" != "200" ]; then
            echo "Failed to send Telegram alert (HTTP $SEND_CODE)."
            exit 2
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
